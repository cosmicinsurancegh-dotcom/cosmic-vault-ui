<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" role="img" aria-label="An emerald-cut green gemstone under studio light">
  
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="72%">
      <stop offset="0" stop-color="hsl(158 29% 17%)"/>
      <stop offset="0.55" stop-color="hsl(158 23.2% 8%)"/>
      <stop offset="1" stop-color="hsl(158 17.4% 3%)"/>
    </radialGradient>
    <radialGradient id="key" cx="34%" cy="18%" r="62%">
      <stop offset="0" stop-color="hsl(158 78% 74%)" stop-opacity="0.42"/>
      <stop offset="0.6" stop-color="hsl(158 78% 74%)" stop-opacity="0.08"/>
      <stop offset="1" stop-color="hsl(158 78% 74%)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="46%" r="68%">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.6"/>
    </radialGradient>
    <radialGradient id="caustic" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="hsl(158 72% 52%)" stop-opacity="0.34"/>
      <stop offset="0.6" stop-color="hsl(158 58% 26%)" stop-opacity="0.10"/>
      <stop offset="1" stop-color="hsl(158 58% 12%)" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="bloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.055"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1600" height="1100" fill="url(#bg)"/>
  <rect width="1600" height="1100" fill="url(#key)"/>
  <rect width="1600" height="1100" fill="url(#vignette)"/>
  <rect width="1600" height="1100" filter="url(#grain)" opacity="0.65"/>
  <rect x="0.5" y="0.5" width="1599" height="1099" fill="none" stroke="#fff" stroke-opacity="0.06"/>
