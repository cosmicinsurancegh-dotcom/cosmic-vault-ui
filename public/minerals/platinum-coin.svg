<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" role="img" aria-label="A platinum bullion coin on a dark studio surface">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="80%">
      <stop offset="0" stop-color="#222b39"/>
      <stop offset=".5" stop-color="#0c131e"/>
      <stop offset="1" stop-color="#040810"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="45%" r="45%">
      <stop offset="0" stop-color="#d8e3f3" stop-opacity=".22"/>
      <stop offset=".55" stop-color="#7890ad" stop-opacity=".06"/>
      <stop offset="1" stop-color="#050a12" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".18" stop-color="#c3cedb"/>
      <stop offset=".42" stop-color="#748596"/>
      <stop offset=".66" stop-color="#eef4fa"/>
      <stop offset="1" stop-color="#9dadbd"/>
    </linearGradient>
    <linearGradient id="p2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eff5fb"/>
      <stop offset=".4" stop-color="#8d9dad"/>
      <stop offset="1" stop-color="#3e4c5b"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset=".5" stop-color="#8b9baa"/>
      <stop offset="1" stop-color="#374452"/>
    </linearGradient>
    <radialGradient id="face" cx="42%" cy="34%" r="70%">
      <stop offset="0" stop-color="#e7eef6"/>
      <stop offset=".55" stop-color="#a8b6c4"/>
      <stop offset="1" stop-color="#566574"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".06"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1600" height="1100" fill="url(#bg)"/>
  <ellipse cx="800" cy="500" rx="560" ry="420" fill="url(#halo)"/>
  <g fill="#e8f1fa" opacity=".45">
    <circle cx="240" cy="220" r="1.2"/><circle cx="1340" cy="210" r="1.4"/><circle cx="1430" cy="640" r="1"/>
    <circle cx="190" cy="740" r="1.5"/><circle cx="1150" cy="130" r=".8"/>
  </g>
  <ellipse cx="800" cy="855" rx="300" ry="60" fill="#000" opacity=".68" filter="url(#soft)"/>
  <g transform="rotate(-14 800 480)">
    <circle cx="800" cy="480" r="330" fill="url(#rim)"/>
    <circle cx="800" cy="480" r="304" fill="url(#face)"/>
    <circle cx="800" cy="480" r="278" fill="none" stroke="#eaf2fa" stroke-opacity=".45" stroke-width="4"/>
    <circle cx="800" cy="480" r="252" fill="none" stroke="#394653" stroke-opacity=".5" stroke-width="2"/>
    <g fill="none" stroke="#3a4652" stroke-opacity=".62" stroke-width="4">
      <path d="M800 228v22M800 710v22M548 480h22M1030 480h22"/>
    </g>
    <!-- embossed vault motif -->
    <g transform="translate(800 470)" fill="none" stroke="url(#p1)" stroke-width="8">
      <path d="M-142-142 0-214 142-142 142 142 0 214-142 142Z" opacity=".65"/>
      <path d="M-90-90 0-144 90-90 90 90 0 144-90 90Z" opacity=".9"/>
      <circle cx="0" cy="0" r="52" opacity=".95"/>
      <circle cx="0" cy="0" r="18" fill="#5b6a79" opacity=".8"/>
      <path d="M0-52V-80M0 52V80M-52 0H-80M52 0H80" opacity=".55"/>
      <path d="M-28-34 0 0 28-34" opacity=".7"/>
    </g>
    <text x="800" y="345" text-anchor="middle" fill="#34404d" font-family="Georgia, serif" font-size="34" letter-spacing="14" opacity=".82">COSMIC VAULT</text>
    <text x="800" y="740" text-anchor="middle" fill="#34404d" font-family="Georgia, serif" font-size="24" letter-spacing="8" opacity=".66">1 OZ · 999.5 PLATINUM</text>
    <path d="M600 245A330 330 0 0 1 980 245" fill="none" stroke="#ffffff" stroke-opacity=".55" stroke-width="7"/>
    <path d="M1015 640A330 330 0 0 1 860 798" fill="none" stroke="#1e2832" stroke-opacity=".35" stroke-width="9"/>
  </g>
  <rect width="1600" height="1100" filter="url(#grain)" opacity=".5"/>
  <rect x=".5" y=".5" width="1599" height="1099" fill="none" stroke="#fff" stroke-opacity=".07"/>
</svg>
