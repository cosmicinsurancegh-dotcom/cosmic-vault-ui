<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" role="img" aria-label="A raw gold nugget on a dark studio surface">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="80%">
      <stop offset="0" stop-color="#282014"/>
      <stop offset=".5" stop-color="#120d07"/>
      <stop offset="1" stop-color="#060402"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="45%" r="45%">
      <stop offset="0" stop-color="#ffcf63" stop-opacity=".28"/>
      <stop offset=".55" stop-color="#9b6817" stop-opacity=".08"/>
      <stop offset="1" stop-color="#080502" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="n1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0b8"/>
      <stop offset=".18" stop-color="#ffc844"/>
      <stop offset=".45" stop-color="#c98713"/>
      <stop offset=".72" stop-color="#6d3f05"/>
      <stop offset="1" stop-color="#e8a92e"/>
    </linearGradient>
    <linearGradient id="n2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd97a"/>
      <stop offset=".4" stop-color="#b27616"/>
      <stop offset="1" stop-color="#3f2404"/>
    </linearGradient>
    <linearGradient id="n3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#432604"/>
      <stop offset=".5" stop-color="#d79a20"/>
      <stop offset="1" stop-color="#ffe8a0"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="32"/></filter>
    <filter id="blur2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".06"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1600" height="1100" fill="url(#bg)"/>
  <ellipse cx="800" cy="500" rx="560" ry="420" fill="url(#halo)"/>
  <g fill="#ffe7a8" opacity=".4">
    <circle cx="235" cy="220" r="1.2"/><circle cx="1335" cy="220" r="1.4"/><circle cx="1420" cy="640" r="1"/>
    <circle cx="190" cy="730" r="1.5"/><circle cx="1140" cy="130" r=".8"/>
  </g>
  <ellipse cx="800" cy="855" rx="320" ry="64" fill="#000" opacity=".7" filter="url(#soft)"/>
  <ellipse cx="800" cy="500" rx="280" ry="220" fill="#ffb52e" opacity=".1" filter="url(#blur2)"/>
  <g>
    <path d="M540 620 570 470 700 350 860 330 1005 400 1095 540 1080 690 970 805 805 850 680 800 585 735Z" fill="url(#n1)" stroke="#ffe9a8" stroke-opacity=".4" stroke-width="2"/>
    <path d="M700 350 800 440 860 330 1005 400 1040 500 930 560 860 500 780 550 700 470 600 500 570 470Z" fill="url(#n2)"/>
    <path d="M600 500 700 470 780 550 750 660 680 725 585 735 570 600Z" fill="url(#n3)" opacity=".9"/>
    <path d="M930 560 1040 500 1095 540 1080 690 970 805 860 760 820 680Z" fill="#8a550b" opacity=".85"/>
    <path d="M780 550 860 500 930 560 900 650 820 680 750 660Z" fill="#6b3f06"/>
    <path d="M780 550 820 680 900 650 930 560 860 500Z" fill="url(#n2)"/>
    <path d="M700 470 780 550 750 660 680 725 640 640 610 560Z" fill="#a66c0f" opacity=".75"/>
    <!-- metallic highlights -->
    <g fill="none" stroke-linecap="round">
      <path d="M600 540 700 470 800 440 860 330" stroke="#fff2bd" stroke-opacity=".5" stroke-width="5"/>
      <path d="M750 660 820 680 900 650" stroke="#ffdf86" stroke-opacity=".35" stroke-width="3"/>
      <path d="M930 560 1040 500" stroke="#ffe6a2" stroke-opacity=".45" stroke-width="3"/>
      <path d="M615 690 680 725" stroke="#4a2a04" stroke-opacity=".5" stroke-width="4"/>
    </g>
    <g fill="#fff4c9" opacity=".5">
      <circle cx="705" cy="462" r="3"/><circle cx="812" cy="447" r="2.2"/><circle cx="948" cy="570" r="2.6"/><circle cx="760" cy="650" r="2"/>
      <circle cx="640" cy="610" r="1.8"/><circle cx="880" cy="760" r="2"/>
    </g>
    <path d="M540 620 570 470 700 350 640 420 590 520 585 735Z" fill="#3c2203" opacity=".38"/>
  </g>
  <g opacity=".55">
    <path d="M1170 890 1430 890" stroke="#ffdc88" stroke-opacity=".22"/>
    <text x="1170" y="930" fill="#ffe6ad" font-family="Georgia, serif" font-size="18" letter-spacing="7" opacity=".6">VICTORIA · 212.4 G</text>
  </g>
  <rect width="1600" height="1100" filter="url(#grain)" opacity=".55"/>
  <rect x=".5" y=".5" width="1599" height="1099" fill="none" stroke="#fff" stroke-opacity=".07"/>
</svg>
