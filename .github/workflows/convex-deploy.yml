name: Deploy Convex functions

# Gating:
#   push to `dev`    -> avid-camel-675
#   manual, dev      -> avid-camel-675
#   manual, prod     -> descriptive-ferret-801, only from `main` and only when
#                       `confirm` is typed as deploy-prod.
# No push ever reaches production: a merge to `main` is not a deploy.
#
# Both deploys are also gated on the unit suite (`unit` job below): a failing
# guard, or any other red test, stops the deploy instead of shipping next to a
# red check, dev and production alike. That job calls
# .github/workflows/unit-tests.yml, the same workflow every push runs, so the
# gate and the push check cannot drift apart.
on:
  push:
    branches: [dev]
    paths:
      - "src/convex/**"
      - "convex.json"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/convex-deploy.yml"
  workflow_dispatch:
    inputs:
      target:
        description: Deployment to push functions to
        type: choice
        required: true
        options: [dev, prod]
      confirm:
        description: Type deploy-prod to confirm a production deploy (required for target=prod)
        type: string
        required: false

permissions:
  contents: read

# One deploy at a time per deployment, so two pushes cannot interleave.
concurrency:
  group: convex-${{ github.event_name == 'workflow_dispatch' && inputs.target || (github.ref == 'refs/heads/main' && 'prod' || 'dev') }}
  cancel-in-progress: false

jobs:
  # The suite lives in one file. This job only calls it, so a change to the
  # steps reaches the gate and the every-push check at the same time; a calling
  # job takes no steps and no timeout of its own (unit-tests.yml sets both).
  unit:
    name: Vitest unit suite
    uses: ./.github/workflows/unit-tests.yml
    permissions:
      contents: read

  dev:
    name: Deploy functions to dev (avid-camel-675)
    # No green suite, no deploy. A failed dependency skips this job, so the
    # functions keep whatever version is currently deployed.
    needs: unit
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'dev')
    runs-on: ubuntu-latest
    environment: convex-dev
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # No version input: setup-bun reads `packageManager` from package.json,
      # so CI installs with the same Bun that wrote `bun.lock`.
      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Catches an empty secret and the worst copy/paste mistake: the prod key
      # sitting in the dev secret, which would silently deploy production.
      - name: Verify deploy key scope
        env:
          KEY: ${{ secrets.CONVEX_DEPLOY_KEY_DEV }}
          EXPECTED: dev
        run: |
          set -euo pipefail
          if [ -z "${KEY}" ]; then
            echo "::error::CONVEX_DEPLOY_KEY_DEV is not set. Add it as a repository or convex-dev environment secret."
            exit 1
          fi
          case "${KEY}" in
            "${EXPECTED}":*) echo "Key scope: ${EXPECTED}" ;;
            *)
              echo "::error::CONVEX_DEPLOY_KEY_DEV is scoped to '${KEY%%:*}', not '${EXPECTED}'. Refusing to deploy."
              exit 1
              ;;
          esac

      # The key alone selects the deployment; no CONVEX_DEPLOYMENT is needed.
      - name: Deploy functions
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_DEV }}
        run: bunx convex deploy --yes

  prod:
    name: Deploy functions to prod (descriptive-ferret-801)
    # Gated on `unit` exactly like dev, so production is never released from a
    # red tree: fix the test, or the code, and let the suite go green.
    needs: unit
    # Dispatch runs from whichever branch was selected, so prod also requires
    # main. Pushes never qualify.
    if: |
      github.event_name == 'workflow_dispatch' &&
      inputs.target == 'prod' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: convex-prod
    timeout-minutes: 10
    steps:
      # A dispatch that forgets the phrase fails loudly here instead of quietly
      # skipping, so a half-filled form can never look like a deploy.
      - name: Check production confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "${CONFIRM}" != "deploy-prod" ]; then
            echo "::error::Production deploys require confirm=deploy-prod. Re-run from main with target=prod and type that phrase."
            exit 1
          fi

      - uses: actions/checkout@v4

      # No version input: setup-bun reads `packageManager` from package.json,
      # so CI installs with the same Bun that wrote `bun.lock`.
      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify deploy key scope
        env:
          KEY: ${{ secrets.CONVEX_DEPLOY_KEY_PROD }}
          EXPECTED: prod
        run: |
          set -euo pipefail
          if [ -z "${KEY}" ]; then
            echo "::error::CONVEX_DEPLOY_KEY_PROD is not set. Add it as a repository or convex-prod environment secret."
            exit 1
          fi
          case "${KEY}" in
            "${EXPECTED}":*) echo "Key scope: ${EXPECTED}" ;;
            *)
              echo "::error::CONVEX_DEPLOY_KEY_PROD is scoped to '${KEY%%:*}', not '${EXPECTED}'. Refusing to deploy."
              exit 1
              ;;
          esac

      - name: Deploy functions
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_PROD }}
        run: bunx convex deploy --yes
