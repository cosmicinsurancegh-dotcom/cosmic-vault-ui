name: Deploy Convex functions

# Gating:
#   push to `main`   -> avid-camel-675 and descriptive-ferret-801
#   manual, dev      -> avid-camel-675
#   manual, prod     -> descriptive-ferret-801, from `main`, and only when
#                       `confirm` is typed as deploy-prod.
#
# A push reaches production. The site is built by Vercel from that same push,
# and the site calls the functions this job publishes, so leaving production
# behind a dispatch meant every release waited on a person to notice - and the
# one time nobody noticed, the published bundle outran its functions and every
# staff dashboard load died on a masked `Server Error` (README, "The site cannot
# publish ahead of its functions"). The `paths` filter below is what makes the
# push a deploy decision rather than a guess: only a push that changes
# `src/convex/**` - or a file the deployment is built from - starts this
# workflow at all. The dispatch stays for a release with no code change, and is
# the only path that needs the confirmation phrase, because it has no diff to
# read.
#
# The two are still two deployments of one commit, and they are not ordered:
# Vercel's build can finish before the functions land. That is what the site's
# own gate is for - it refuses to publish a bundle whose functions production
# does not serve - and the rebuild hook at the end of the `prod` job is what
# completes the release once they do.
#
# The push trigger moved from `dev` to `main` on 2026-10-30, when `dev` was
# deleted and `main` became the only branch (README, "Merging into main").
# Concurrency is declared per job, so each job queues on the deployment it
# writes: a push-triggered dev deploy and a production deploy run of the same
# push never wait on, or cancel, each other's lock.
#
# Both deploys are also gated on the unit suite (`unit` job below): a failing
# guard, or any other red test, stops the deploy instead of shipping next to a
# red check, dev and production alike. That job calls
# .github/workflows/unit-tests.yml, the same workflow every push runs, so the
# gate and the push check cannot drift apart.
on:
  push:
    branches: [main]
    paths:
      - "src/convex/**"
      - "convex.json"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/convex-deploy.yml"
  workflow_dispatch:
    inputs:
      target:
        description: Deployment to push functions to
        type: choice
        required: true
        options: [dev, prod]
      confirm:
        description: Type deploy-prod to confirm a production deploy (required for target=prod)
        type: string
        required: false

permissions:
  contents: read

# One deploy at a time per deployment, so two pushes cannot interleave. The
# group names the deployment and is declared on each job rather than on the
# workflow, because a push now writes both: a single workflow-level group would
# have to be named for one of them. Keying on the ref would put every push in
# `convex-prod` - the ref is `main` for both - and a push would then queue
# against, or be cancelled by, a real production release. `cancel-in-progress`
# stays false: racing deployments of the same functions is what this prevents.
jobs:
  # The suite lives in one file. This job only calls it, so a change to the
  # steps reaches the gate and the every-push check at the same time; a calling
  # job takes no steps and no timeout of its own (unit-tests.yml sets both).
  unit:
    name: Vitest unit suite
    uses: ./.github/workflows/unit-tests.yml
    permissions:
      contents: read

  dev:
    name: Deploy functions to dev (avid-camel-675)
    # No green suite, no deploy. A failed dependency skips this job, so the
    # functions keep whatever version is currently deployed.
    needs: unit
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'dev')
    concurrency:
      group: convex-dev
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: convex-dev
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # No version input: setup-bun reads `packageManager` from package.json,
      # so CI installs with the same Bun that wrote `bun.lock`.
      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Catches an empty secret and the worst copy/paste mistake: the prod key
      # sitting in the dev secret, which would silently deploy production.
      - name: Verify deploy key scope
        env:
          KEY: ${{ secrets.CONVEX_DEPLOY_KEY_DEV }}
          EXPECTED: dev
        run: |
          set -euo pipefail
          if [ -z "${KEY}" ]; then
            echo "::error::CONVEX_DEPLOY_KEY_DEV is not set. Add it as a repository or convex-dev environment secret."
            exit 1
          fi
          case "${KEY}" in
            "${EXPECTED}":*) echo "Key scope: ${EXPECTED}" ;;
            *)
              echo "::error::CONVEX_DEPLOY_KEY_DEV is scoped to '${KEY%%:*}', not '${EXPECTED}'. Refusing to deploy."
              exit 1
              ;;
          esac

      # The key alone selects the deployment; no CONVEX_DEPLOYMENT is needed.
      - name: Deploy functions
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_DEV }}
        run: bunx convex deploy --yes

  prod:
    name: Deploy functions to prod (descriptive-ferret-801)
    # Gated on `unit` exactly like dev, so production is never released from a
    # red tree: fix the test, or the code, and let the suite go green.
    needs: unit
    # A push and a dispatch both qualify, from `main` either way: a dispatch can
    # select any branch, and the deploy must be the commit that is on main. The
    # push case needs no confirmation phrase - the workflow's `paths` filter has
    # already decided that this push is a functions release, and the phrase on a
    # push trigger that nobody fills in would only fail every release.
    if: |
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.target == 'prod'))
    concurrency:
      group: convex-prod
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: convex-prod
    timeout-minutes: 10
    steps:
      # A dispatch that forgets the phrase fails loudly here instead of quietly
      # skipping, so a half-filled form can never look like a deploy. Only a
      # dispatch can leave it blank, which is why only a dispatch is asked.
      - name: Check production confirmation
        if: github.event_name == 'workflow_dispatch'
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "${CONFIRM}" != "deploy-prod" ]; then
            echo "::error::Production deploys require confirm=deploy-prod. Re-run from main with target=prod and type that phrase."
            exit 1
          fi

      - uses: actions/checkout@v5

      # No version input: setup-bun reads `packageManager` from package.json,
      # so CI installs with the same Bun that wrote `bun.lock`.
      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify deploy key scope
        env:
          KEY: ${{ secrets.CONVEX_DEPLOY_KEY_PROD }}
          EXPECTED: prod
        run: |
          set -euo pipefail
          if [ -z "${KEY}" ]; then
            echo "::error::CONVEX_DEPLOY_KEY_PROD is not set. Add it as a repository or convex-prod environment secret."
            exit 1
          fi
          case "${KEY}" in
            "${EXPECTED}":*) echo "Key scope: ${EXPECTED}" ;;
            *)
              echo "::error::CONVEX_DEPLOY_KEY_PROD is scoped to '${KEY%%:*}', not '${EXPECTED}'. Refusing to deploy."
              exit 1
              ;;
          esac

      - name: Deploy functions
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_PROD }}
        run: bunx convex deploy --yes

      # Records which functions are now serving, and only after the push above
      # succeeded: a stamp written before a failed deploy would claim functions
      # production does not run, which is the one direction the site gate cannot
      # recover from. The list is read *back* from the deployment, so the stamp
      # is what is actually running rather than what this checkout asked for;
      # `setup:release` returns it (`src/convex/setup.ts`) and the site build
      # refuses to publish while a function its bundle calls is missing
      # (`scripts/check-backend-release.mjs`).
      #
      # No `--deployment <name>` here, and that is deliberate. Naming a
      # deployment makes the CLI look it up with
      # `GET deployment/<name>/team_and_project`, which wants a user credential
      # and answers `UnexpectedAuthHeaderFormat: ... If you are trying to use
      # preview deployments, please generate a new key` for a deploy key. That is
      # what broke this step on every push from 2026-10-30: the functions below
      # this point were published, then the stamp failed, and the two steps after
      # it never ran. Left to the deploy key, `function-spec` resolves its
      # credentials through the same `deployment/...for_key` / `provision_and_
      # authorize` endpoints `convex deploy` just used, so it reads back from the
      # deployment that was published in the step above rather than one being
      # selected again.
      #
      # The named deployment is checked on the answer instead of the question:
      # the spec carries the URL it came from, and a mismatch fails here rather
      # than stamping a deployment with another one's functions - the direction
      # the site gate cannot recover from.
      - name: Publish the served functions and their shapes
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_PROD }}
          DEPLOYMENT: descriptive-ferret-801
        run: |
          set -euo pipefail
          bunx convex function-spec > "${RUNNER_TEMP}/function-spec.json"
          SERVED=$(SPEC="${RUNNER_TEMP}/function-spec.json" node -e 'const spec = require(process.env.SPEC); process.stdout.write(spec.url ?? "")')
          case "${SERVED}" in
            "https://${DEPLOYMENT}.convex.cloud"|"https://${DEPLOYMENT}.convex.cloud/")
              echo "Read the spec back from ${SERVED}."
              ;;
            *)
              echo "::error::Expected the spec from https://${DEPLOYMENT}.convex.cloud, got '${SERVED}'. The deploy key resolved to another deployment, so this stamp would describe the wrong functions. Refusing to publish it."
              exit 1
              ;;
          esac
          STAMP=$(bun scripts/convex-signatures.mjs --spec "${RUNNER_TEMP}/function-spec.json")
          bunx convex env set APP_FUNCTIONS "${STAMP}"
          echo "Stamped ${DEPLOYMENT} with the functions it serves and their argument and return shapes."

      # The same gate a production site build runs, against the deployment just
      # stamped. It catches what the stamp alone cannot: an environment variable
      # that did not take effect. Retried a few times because a new value needs a
      # moment to reach every isolate, which is propagation lag rather than a
      # flaky check - the loop is bounded, so a real failure still fails the job.
      - name: Verify the site may publish
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if bun scripts/check-backend-release.mjs --production; then
              exit 0
            fi
            echo "::warning::Not serving the expected functions yet (attempt ${attempt}/5); a stamp takes a moment to reach every isolate."
            sleep 5
          done
          echo "::error::The production deployment still does not serve the functions this commit's site calls. The site build will refuse to publish."
          exit 1

      # On a push the site build started at the same moment as this job, so it
      # may have been refused by the gate above - the expected race, and why
      # the domain can keep serving the previous release after a push that
      # published functions. Rebuilding the same commit now that its functions
      # exist is what completes the release. Without the hook the deployment is
      # a manual "Redeploy" in Vercel; the warning says so instead of pretending
      # the release finished.
      - name: Rebuild the site on the new functions
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${HOOK}" ]; then
            echo "::warning::VERCEL_DEPLOY_HOOK_URL is not set - redeploy ${GITHUB_SHA} manually in Vercel so the site picks up the functions published just now."
            exit 0
          fi
          curl -fsS -X POST "${HOOK}" > /dev/null
          echo "Requested a site rebuild for ${GITHUB_SHA}."
