              - generic [ref=e604]:
                - paragraph [ref=e605]: A storage provider holds the object. An insurer prices the risk. The gap between them is where claims quietly fail — who had it when, what it weighed, which seal was intact. Cosmic Vault closes that gap by doing both against one record.
                - paragraph [ref=e606]: The deposit photograph, the assay, the appraisal, the policy number and every release movement sit on the same certificate. When something moves, the insurance moves with it.
